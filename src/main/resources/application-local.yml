spring:
  application:
    name: user-info-ms

  datasource:
    url: jdbc:postgresql://localhost:5432/user_info_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  servlet:
    context-path: /user-info-ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG

env:
  jwt:
    secret: your-256-bit-secret-key-here-make-it-long
    expiration: 86400000
